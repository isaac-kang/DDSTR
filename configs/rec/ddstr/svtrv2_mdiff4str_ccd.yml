# DDSTR CCD mode: SVTRv2 + MDiff4STR trained on CCD-decomposed data
# Usage: cd tools && python train_rec.py -c ../configs/rec/ddstr/svtrv2_mdiff4str_ccd.yml
#
# CCD extends the charset with Unicode variants for confused character classes.
# The model trains with an extended charset; during eval, PLCharsetAdapter maps
# extended chars back to base chars for proper comparison.
#
# To generate CCD data:
#   python tools/confusion_and_pl.py -c configs/rec/mdiff4str/svtrv2_mdiffdecoder_base.yml --checkpoint <ckpt>

Global:
  device: gpu
  epoch_num: 40
  log_smooth_window: 20
  print_batch_step: 10
  output_dir: ./output/rec/ddstr/svtrv2_mdiff4str_ccd/
  save_epoch_step: [30, 1]
  eval_batch_step: [0, 500]
  eval_epoch_step: [0, 1]
  cal_metric_during_train: False
  pretrained_model:
  checkpoints:
  use_tensorboard: false
  infer_img:
  character_dict_path: &character_dict_path ./tools/utils/EN_symbol_dict.txt
  max_text_length: &max_text_length 25
  use_space_char: &use_space_char False
  save_res_path: ./output/rec/ddstr/predicts_svtrv2_mdiff4str_ccd.txt
  use_amp: True
  grad_clip_val: 20.0
  # CCD mode: unicode_mapping triggers extended charset + PLCharsetAdapter
  unicode_mapping: ~/data/STR/ddstr/CCD/mdiff4str/unicode_mapping.json

Optimizer:
  name: AdamW
  lr: 0.0005
  weight_decay: 0.05
  filter_bias_and_bn: True

LRScheduler:
  name: OneCycleLR
  warmup_epoch: 1.5
  cycle_momentum: False

Architecture:
  model_type: rec
  algorithm: MDiff4STR
  in_channels: 3
  Transform:
  Encoder:
    name: SVTRv2LNConvTwo33
    use_pos_embed: False
    dims: [128, 256, 384]
    depths: [6, 6, 6]
    num_heads: [4, 8, 12]
    mixer: [['Conv','Conv','Conv','Conv','Conv','Conv'],['Conv','Conv','FGlobal','Global','Global','Global'],['Global','Global','Global','Global','Global','Global']]
    local_k: [[5, 5], [5, 5], [-1, -1]]
    sub_k: [[1, 1], [2, 1], [-1, -1]]
    last_stage: false
    feat2d: False
  Decoder:
    name: MDiffDecoder
    num_decoder_layers: 6
    nhead: 6
    max_len: *max_text_length
    parallel_decoding: False
    autoregressive_decoding: False
    low_confidence_decoding: False
    random_mask_decoding: False
    semi_autoregressive_decoding: False
    cloze_mask_decoding: False
    sampler_step: 3
    sample_k: &sample_k 3
    temperature: 1.0

Loss:
  name: MDiffLoss

PostProcess:
  name: ARLabelDecode
  character_dict_path: *character_dict_path
  use_space_char: *use_space_char

Metric:
  name: RecMetric
  main_indicator: acc
  is_filter: True

Train:
  dataset:
    name: RatioDataSetTVResize
    ds_width: True
    padding: false
    # CCD: point to decomposed LMDB (labels contain Unicode variant chars)
    data_dir_list: [
      '~/data/STR/ddstr/CCD/mdiff4str/Union14M-L-LMDB-Filtered/filter_train_challenging',
      '~/data/STR/ddstr/CCD/mdiff4str/Union14M-L-LMDB-Filtered/filter_train_hard',
      '~/data/STR/ddstr/CCD/mdiff4str/Union14M-L-LMDB-Filtered/filter_train_medium',
      '~/data/STR/ddstr/CCD/mdiff4str/Union14M-L-LMDB-Filtered/filter_train_normal',
      '~/data/STR/ddstr/CCD/mdiff4str/Union14M-L-LMDB-Filtered/filter_train_easy',
    ]
    transforms:
      - DecodeImagePIL:
          img_mode: RGB
      - PARSeqAugPIL:
      - MDiffLabelEncode:
          character_dict_path: *character_dict_path
          use_space_char: *use_space_char
          max_text_length: *max_text_length
          sample_num: *sample_k
      - KeepKeys:
          keep_keys: ['image', 'label', 'reflect_ids', 'noisy_batch', 'masked_indices', 'p_mask', 'length']
  sampler:
    name: RatioSampler
    scales: [[128, 32]]
    first_bs: &bs 256
    fix_bs: false
    divided_factor: [4, 16]
    is_training: True
  loader:
    shuffle: True
    batch_size_per_card: *bs
    drop_last: True
    max_ratio: &max_ratio 4
    num_workers: 4

Eval:
  dataset:
    name: RatioDataSetTVResize
    ds_width: True
    padding: False
    data_dir_list: [
      '~/data/STR/openocr/evaluation/CUTE80',
      '~/data/STR/openocr/evaluation/IC13_857',
      '~/data/STR/openocr/evaluation/IC15_1811',
      '~/data/STR/openocr/evaluation/IIIT5k_3000',
      '~/data/STR/openocr/evaluation/SVT',
      '~/data/STR/openocr/evaluation/SVTP',
      ]
    transforms:
      - DecodeImagePIL:
          img_mode: RGB
      - ARLabelEncode:
          character_dict_path: *character_dict_path
          use_space_char: *use_space_char
          max_text_length: *max_text_length
      - KeepKeys:
          keep_keys: ['image', 'label', 'length']
  sampler:
    name: RatioSampler
    scales: [[128, 32]]
    first_bs: *bs
    fix_bs: false
    divided_factor: [4, 16]
    is_training: False
  loader:
    shuffle: False
    drop_last: False
    batch_size_per_card: *bs
    max_ratio: *max_ratio
    num_workers: 4
