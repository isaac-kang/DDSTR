# DDSTR CCD mode: IGTR trained on CCD-decomposed data
# Usage: cd tools && python train_rec.py -c ../configs/rec/ddstr/igtr_ccd.yml
#
# CCD extends the charset with Unicode variants for confused character classes.
# The model trains with an extended charset; during eval, PLCharsetAdapter maps
# extended chars back to base chars for proper comparison.
#
# To generate CCD data:
#   python tools/confusion_and_pl.py -c configs/rec/igtr/svtr_base_ds_igtr.yml --checkpoint <ckpt>

Global:
  device: gpu
  epoch_num: 20
  log_smooth_window: 20
  print_batch_step: 10
  output_dir: ./output/rec/ddstr/igtr_ccd/
  save_epoch_step: [15, 1]
  eval_batch_step: [0, 500]
  eval_epoch_step: [0, 1]
  cal_metric_during_train: True
  pretrained_model:
  checkpoints:
  use_tensorboard: false
  infer_img:
  character_dict_path: &character_dict_path ./tools/utils/EN_symbol_dict.txt
  max_text_length: &max_text_length 25
  use_space_char: &use_space_char False
  save_res_path: ./output/rec/ddstr/predicts_igtr_ccd.txt
  use_amp: True
  # CCD mode: unicode_mapping triggers extended charset + PLCharsetAdapter
  unicode_mapping: ~/data/STR/ddstr/CCD/igtr/unicode_mapping.json

Optimizer:
  name: AdamW
  lr: 0.0005
  weight_decay: 0.05
  filter_bias_and_bn: True

LRScheduler:
  name: OneCycleLR
  warmup_epoch: 1.5
  cycle_momentum: False

Architecture:
  model_type: rec
  algorithm: IGTR
  in_channels: 3
  Transform:
  Encoder:
    name: SVTRNet2DPos
    img_size: [32, -1]
    out_char_num: 25
    out_channels: 256
    patch_merging: 'Conv'
    embed_dim: [128, 256, 384]
    depth: [6, 6, 6]
    num_heads: [4, 8, 12]
    mixer: ['ConvB','ConvB','ConvB','ConvB','ConvB','ConvB', 'ConvB','ConvB', 'Global','Global','Global','Global','Global','Global','Global','Global','Global','Global']
    local_mixer: [[5, 5], [5, 5], [5, 5]]
    last_stage: False
    prenorm: True
    use_first_sub: False
  Decoder:
    name: IGTRDecoder
    dim: 384
    num_layer: 1
    ar: False
    refine_iter: 0
    next_pred: False
    pos2d: True
    ds: True

Loss:
  name: IGTRLoss

PostProcess:
  name: IGTRLabelDecode
  character_dict_path: *character_dict_path
  use_space_char: *use_space_char

Metric:
  name: RecMetric
  main_indicator: acc

Train:
  dataset:
    name: RatioDataSet
    ds_width: True
    padding: &padding False
    # CCD: point to decomposed LMDB (labels contain Unicode variant chars)
    data_dir_list: [
      '~/data/STR/ddstr/CCD/igtr/Union14M-L-LMDB-Filtered/filter_train_challenging',
      '~/data/STR/ddstr/CCD/igtr/Union14M-L-LMDB-Filtered/filter_train_hard',
      '~/data/STR/ddstr/CCD/igtr/Union14M-L-LMDB-Filtered/filter_train_medium',
      '~/data/STR/ddstr/CCD/igtr/Union14M-L-LMDB-Filtered/filter_train_normal',
      '~/data/STR/ddstr/CCD/igtr/Union14M-L-LMDB-Filtered/filter_train_easy',
    ]
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: False
      - PARSeqAug:
      - IGTRLabelEncode:
          k: 8
          prompt_error: False
          character_dict_path: *character_dict_path
          use_space_char: *use_space_char
          max_text_length: *max_text_length
      - KeepKeys:
          keep_keys: ['image', 'label', 'prompt_pos_idx_list',
          'prompt_char_idx_list', 'ques_pos_idx_list', 'ques1_answer_list',
          'ques2_char_idx_list', 'ques2_answer_list', 'ques3_answer', 'ques4_char_num_list',
          'ques_len_list', 'ques2_len_list', 'prompt_len_list', 'length']
  sampler:
    name: RatioSampler
    scales: [[128, 32]]
    first_bs: &bs 384
    fix_bs: false
    divided_factor: [4, 16]
    is_training: True
  loader:
    shuffle: True
    batch_size_per_card: *bs
    drop_last: True
    max_ratio: &max_ratio 4
    num_workers: 4

Eval:
  dataset:
    name: RatioDataSet
    ds_width: True
    padding: *padding
    data_dir_list: [
      '~/data/STR/openocr/evaluation/CUTE80',
      '~/data/STR/openocr/evaluation/IC13_857',
      '~/data/STR/openocr/evaluation/IC15_1811',
      '~/data/STR/openocr/evaluation/IIIT5k',
      '~/data/STR/openocr/evaluation/SVT',
      '~/data/STR/openocr/evaluation/SVTP',
      ]
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: False
      - ARLabelEncode:
          character_dict_path: *character_dict_path
          use_space_char: *use_space_char
          max_text_length: *max_text_length
      - KeepKeys:
          keep_keys: ['image', 'label', 'length']
  sampler:
    name: RatioSampler
    scales: [[128, 32]]
    first_bs: 256
    fix_bs: false
    divided_factor: [4, 16]
    is_training: False
  loader:
    shuffle: False
    drop_last: False
    batch_size_per_card: 256
    max_ratio: *max_ratio
    num_workers: 4
