# MDiff4STR fine-tune: retrain entire decoder from scratch
#   - entire decoder randomly initialized, encoder weights loaded from pretrained
#   - backbone frozen for freeze_epochs, then full joint training
#
# Usage: cd tools && python train_rec.py -c ../configs/rec/mdiff4str/svtrv2_mdiffdecoder_finetune_decoder.yml

Global:
  device: gpu
  epoch_num: 5
  log_smooth_window: 20
  print_batch_step: 10
  output_dir: ./output/rec/u14m_filter/svtrv2_mdiffdecoder_finetune_decoder_fresh_1_5_2e-4_YA-svtr/
  save_epoch_step: [0, 1]
  eval_batch_step: [0, 500]
  eval_epoch_step: [0, 1]
  cal_metric_during_train: False
  pretrained_model: ./pretrained/svtrv2_smtr_gtc_rctc
  checkpoints:
  use_tensorboard: false
  use_wandb: true
  infer_img:
  character_dict_path: &character_dict_path ./tools/utils/EN_symbol_dict.txt
  max_text_length: &max_text_length 25
  use_space_char: &use_space_char False
  save_res_path: ./output/rec/u14m_filter/predicts_svtrv2_mdiffdecoder_finetune_decoder_fresh.txt
  use_amp: True
  grad_clip_val: 20.0
  fresh_params:
    - 'decoder.'  # reinit entire decoder
  freeze_epochs: 20

Optimizer:
  name: AdamW
  lr: 0.0002
  weight_decay: 0.05
  filter_bias_and_bn: True

LRScheduler:
  name: OneCycleLR
  warmup_epoch: 1
  cycle_momentum: False

Architecture:
  model_type: rec
  algorithm: MDiff4STR
  in_channels: 3
  Transform:
  Encoder:
    name: SVTRv2LNConvTwo33
    use_pos_embed: False
    dims: [128, 256, 384]
    depths: [6, 6, 6]
    num_heads: [4, 8, 12]
    mixer: [['Conv','Conv','Conv','Conv','Conv','Conv'],['Conv','Conv','FGlobal','Global','Global','Global'],['Global','Global','Global','Global','Global','Global']]
    local_k: [[5, 5], [5, 5], [-1, -1]]
    sub_k: [[1, 1], [2, 1], [-1, -1]]
    last_stage: false
    feat2d: False
  Decoder:
    name: MDiffDecoder
    num_decoder_layers: 6
    nhead: 6
    max_len: *max_text_length
    parallel_decoding: False
    autoregressive_decoding: False
    low_confidence_decoding: False
    random_mask_decoding: False
    semi_autoregressive_decoding: True
    cloze_mask_decoding: False
    sampler_step: 3
    sample_k: &sample_k 3
    temperature: 1.0

Loss:
  name: MDiffLoss

PostProcess:
  name: ARLabelDecode
  character_dict_path: *character_dict_path
  use_space_char: *use_space_char

Metric:
  name: RecMetric
  main_indicator: acc
  is_filter: True

Train:
  dataset:
    name: RatioDataSetTVResize
    ds_width: True
    padding: false
    data_dir_list: [
      '~/data/STR/openocr/Union14M-L-LMDB-Filtered/filter_train_challenging',
      '~/data/STR/openocr/Union14M-L-LMDB-Filtered/filter_train_hard',
      '~/data/STR/openocr/Union14M-L-LMDB-Filtered/filter_train_medium',
      '~/data/STR/openocr/Union14M-L-LMDB-Filtered/filter_train_normal',
      '~/data/STR/openocr/Union14M-L-LMDB-Filtered/filter_train_easy',
    ]
    transforms:
      - DecodeImagePIL:
          img_mode: RGB
      - PARSeqAugPIL:
      - MDiffLabelEncode:
          character_dict_path: *character_dict_path
          use_space_char: *use_space_char
          max_text_length: *max_text_length
          sample_num: *sample_k
          train_all_layer: True
      - KeepKeys:
          keep_keys: ['image', 'label', 'reflect_ids', 'noisy_batch', 'masked_indices', 'p_mask', 'length']
  sampler:
    name: RatioSampler
    scales: [[128, 32]]
    first_bs: &bs 256
    fix_bs: false
    divided_factor: [4, 16]
    is_training: True
  loader:
    shuffle: True
    batch_size_per_card: *bs
    drop_last: True
    max_ratio: &max_ratio 4
    num_workers: 4

Eval:
  dataset:
    name: RatioDataSetTVResize
    ds_width: True
    padding: False
    data_dir_list: [
      '~/data/STR/openocr/evaluation/CUTE80',
      '~/data/STR/openocr/evaluation/IC13_857',
      '~/data/STR/openocr/evaluation/IC15_1811',
      '~/data/STR/openocr/evaluation/IIIT5k',
      '~/data/STR/openocr/evaluation/SVT',
      '~/data/STR/openocr/evaluation/SVTP',
      ]
    transforms:
      - DecodeImagePIL:
          img_mode: RGB
      - ARLabelEncode:
          character_dict_path: *character_dict_path
          use_space_char: *use_space_char
          max_text_length: *max_text_length
      - KeepKeys:
          keep_keys: ['image', 'label', 'length']
  sampler:
    name: RatioSampler
    scales: [[128, 32]]
    first_bs: *bs
    fix_bs: false
    divided_factor: [4, 16]
    is_training: False
  loader:
    shuffle: False
    drop_last: False
    batch_size_per_card: *bs
    max_ratio: *max_ratio
    num_workers: 4
